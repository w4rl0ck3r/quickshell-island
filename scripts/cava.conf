# cava do equalizador da ilha (services/Cava.qml → island/Waveform.qml).
#
# 5 bandas mono, raw ASCII no stdout: um frame por linha, valores 0–100
# separados por `;`. Lido com SplitParser, sem polling e sem TTY.
# O processo só vive enquanto há playback (running: Music.playing).
[general]
framerate = 30
bars = 5
autosens = 1
# sleep_timer = 0: no silêncio manda zeros em vez de dormir — a altura
# real (inclusive reta) é sempre verdade, sem congelar nem acordar.
sleep_timer = 0
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
mono_option = average

[smoothing]
noise_reduction = 45
